<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DTR Monitoring & Review</title>
  <link rel="stylesheet" href="../css/dtr-monitoring.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo-container">
      <img src="../assets/cjclogo.jpg" alt="Cor Jesu Logo" class="logo-img" />
    </div>
    <h2>Office Head</h2>
    <ul>
      <li><a href="dtr-monitoring.html" class="active">👤 DTR Monitoring</a></li>
      <li><a href="office-head-dashboard.html">📄 Office Dashboard</a></li>
      <li><a href="evaluation-form.html">📄 Evaluation Form</a></li>
      <li><a href="office-head-requests-review.html">📤 Requests Review</a></li>
      <li><a href="office-head-account-settings.html">⚙️ Account Settings</a></li>
    </ul>
  </div>

  <div class="main-content">
    <header class="main-header">
      <h1>DTR Monitoring & Review</h1>
      <div class="notifications">
        <p>🔔 You have <span id="pendingCount">0</span> pending DTRs to review.</p>
      </div>
    </header>

    <section class="filters">
      <input type="text" id="searchInput" placeholder="Search by name or ID" />
      <input type="date" id="filterDate" />
      <select id="filterOffice">
        <option value="">All Offices</option>
        <option>Registrar</option>
        <option>Library</option>
        <option>Guidance</option>
      </select>
      <select id="filterStatus">
        <option value="">All Statuses</option>
        <option>Present</option>
        <option>Late</option>
        <option>Absent</option>
        <option>Overtime</option>
      </select>
    </section>

    <section class="dtr-table-section">
      <table>
        <thead>
          <tr>
            <th>#</th><th>Name</th><th>Student ID</th><th>Office</th><th>Date</th>
            <th>Time In</th><th>Time Out</th><th>Status</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="dtrTableBody">
          <tr><td colspan="9" style="text-align:center;">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <section class="dtr-details" id="dtrDetailsPanel" style="display: none;">
      <h3>DTR Review</h3>
      <p><strong>Name:</strong> <span id="detailName"></span></p>
      <p><strong>Office:</strong> <span id="detailOffice"></span></p>
      <p><strong>Date:</strong> <span id="detailDate"></span></p>
      <textarea id="remarksText" placeholder="Remarks (optional)"></textarea>
      <div class="btn-group">
        <button class="approve-btn" onclick="submitDTR('Approved')">✅ Approve</button>
        <button class="reject-btn" onclick="submitDTR('Rejected')">❌ Reject</button>
      </div>
    </section>
  </div>

  <script src="../js/dtr-monitoring.js"></script>
</body>
</html>
