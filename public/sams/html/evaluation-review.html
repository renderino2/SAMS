<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Evaluation Review</title>
  <link rel="stylesheet" href="../css/evaluation-review.css" />
</head>
<body>

  <div class="layout">
    <aside class="sidebar">
      <div class="logo-container">
        <img src="../assets/cjclogo.jpg" alt="SAMS Logo" class="logo" width="80px" />
        <div class="sidebar-header">SAMS</div>
      </div>
      <ul class="nav-menu">
        <li><a href="../html/hr-dashboard.html">👤 HR Dashboard</a></li>
        <li><a href="../html/hr-student-assistants.html">📋 Student Assistant Management</a></li>
        <li><a href="../html/contract.html">📝 Contract Management</a></li>
        <li><a href="../html/h">💼 Skill Inventory (HR)</a></li>
        <li><a href="../html/evaluation-review.html" class="active">🧾 Evaluation Review</a></li>
        <li><a href="../html/reports.html">📁 Reports & Exports</a></li>
        <li><a href="../html/hr-account-settings.html">⚙️ Account Settings</a></li>
      </ul>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Evaluation Review</h1>
      </div>

      <div class="filters">
        <input type="text" id="searchName" placeholder="Search by name or ID" />
        <select id="filterOffice">
          <option value="">All Offices</option>
          <option value="Registrar">Registrar</option>
          <option value="Finance">Finance</option>
          <option value="Library">Library</option>
        </select>
        <select id="filterStatus">
          <option value="">Status: All</option>
          <option value="Reviewed">Reviewed</option>
          <option value="Pending">Pending</option>
        </select>
      </div>

      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Student Name</th>
            <th>Office</th>
            <th>Rated By</th>
            <th>Average Rating</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="7" class="no-data">Loading evaluations...</td></tr>
        </tbody>
      </table>
    </main>
  </div>

  <script src="../js/evaluation-review.js"></script>
</body>
</html>
