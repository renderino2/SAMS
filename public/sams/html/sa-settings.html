<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SA Account Settings - SAMS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../css/sa-settings.css" />
</head>
<body>
  <div class="sidebar">
    <div class="logo-title">
      <img src="../assets/final-cjc-logo-1.png" alt="CJC Logo" />
      <h2>SAMS</h2>
    </div>
    <ul class="nav-links">
      <li><a href="sa-dashboard.html">🏠 Student Assistant Dashboard</a></li>
      <li><a href="attendance.html">🕘 Attendance Page</a></li>
      <li><a href="requests.html">📤 Requests Page</a></li>
      <li><a href="sa-skill-inventory.html">🧠 Skill Inventory (Self)</a></li>
      <li><a href="profile.html">👤 Profile Page</a></li>
      <li><a href="sa-settings.html" class="active">⚙️ Account Settings</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="page-header">
      <h1>⚙️ Account Settings</h1>
      <p>Manage your login credentials and personal details securely.</p>
    </div>

    <div class="card">
      <h2>📝 Update Account Details</h2>
      <form id="settingsForm">
        <label for="full_name">Full Name:</label>
        <input type="text" id="full_name" name="full_name" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">New Password:</label>
        <input type="password" id="password" name="password" placeholder="Leave blank to keep current password" />

        <button type="submit">Update Account</button>
        <p id="message"></p>
      </form>
    </div>
  </div>

  <script src="../js/sa-settings.js"></script>
</body>
</html>
